{% extends "base.html" %}
{% block title %}账号{% endblock %}
{% block content %}
<div class="page-head"><div><h1>账号</h1><div class="sub">当前登录：{{ user['username'] }}</div></div></div>

<div class="grid grid-2">
  <div class="card">
    <h3>修改密码</h3>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field"><label>原密码</label><input type="password" name="old_password" required></div>
      <div class="field"><label>新密码（至少 8 位）</label><input type="password" name="new_password" required></div>
      <div class="field"><label>再输一次</label><input type="password" name="confirm_password" required></div>
      <button class="btn primary" type="submit">保存</button>
    </form>
  </div>
  <div class="card">
    <h3>给其他运营开账号</h3>
    <p class="small muted">在服务器上执行，不需要登录网页：</p>
    <pre class="log">python app.py --create-admin 名字 强密码</pre>
    <p class="small muted" style="margin-top:10px">忘了密码就重置：</p>
    <pre class="log">python app.py --reset-password 名字 新密码</pre>
  </div>
</div>
{% endblock %}
